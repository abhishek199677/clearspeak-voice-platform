# ==============================================================================
# ClearSpeak Enterprise Voice AI Platform - High Concurrency Nginx Configuration
# Architected for Global MNC Deployment, DDoS Protection & High Traffic Scale
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with Request-ID and Timing
    log_format enterprise_combined '$remote_addr - $remote_user [$time_local] '
                                   '"$request" $status $body_bytes_sent '
                                   '"$http_referer" "$http_user_agent" '
                                   'req_id="$http_x_request_id" rt=$request_time '
                                   'uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log enterprise_combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer sizes - protect against buffer overflow and DoS attacks
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Rate Limiting & Connection Throttling
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream backend pool with keepalive
    upstream backend_api {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Redirect plain HTTP to HTTPS in production
        # return 301 https://$host$request_uri;

        # Health check bypass (for AWS ALB / GCP / Cloudflare health probes)
        location /health {
            access_log off;
            proxy_pass http://backend_api/health;
            proxy_set_header Host $host;
        }

        # Global Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), display-capture=(self)" always;

        # Root static frontend
        root /usr/share/nginx/html;
        index index.html;

        # Static Assets with aggressive caching
        location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Frontend SPA routing
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Backend REST API — the frontend calls unprefixed paths
        # (/sessions, /stats, /translate, /providers, ...).
        # /api/* is also supported and the prefix is stripped.
        location ~ ^/(sessions|stats|providers|translate|translation-mode|languages|user-language|voices|clone-voice|channels|users|messages|calls|agents|chat|spatial|studio|streams|metrics|docs|redoc|openapi\.json)(/|$) {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 50;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 90s;
            proxy_connect_timeout 10s;
        }

        # Backend REST API (legacy /api/ prefix, stripped before proxying)
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 50;

            proxy_pass http://backend_api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 90s;
            proxy_connect_timeout 10s;
        }

        # WebSocket real-time voice streaming
        location /ws/ {
            limit_conn conn_limit 20;

            proxy_pass http://backend_api/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for long-running voice calls & conferences
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
