version: '3.8'

services:
  # Enterprise Reverse Proxy & SSL Gateway
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend-app/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - clearspeak-net

  # Core Backend API & Voice Pipeline
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
      - ASR_PROVIDER=whisper
      - TTS_PROVIDER=edge
      - LLM_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - TRANSLATION_PROVIDER=local
      - DEFAULT_LANGUAGE=en
      - INDIA_DEFAULT_LANGUAGE=hi
      - ENABLE_AUTO_TRANSLATE=true
      - ALLOWED_HOSTS=["*"]
      - CORS_ORIGINS=["*"]
      - INDIA_LANGUAGE_CODES=["hi","bn","ta","te","ml","kn","gu","mr","pa","ur","as","or","sa","gom","doi","mai","sat","ks","mni","brx","sd","ne"]
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - clearspeak-net

  # Distributed Session & State Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - clearspeak-net

  # Prometheus Telemetry & APM Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - clearspeak-net

  # Observability & SLA Dashboard
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_SECURITY_COOKIE_SECURE=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/clearspeak.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    networks:
      - clearspeak-net

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  clearspeak-net:
    driver: bridge
